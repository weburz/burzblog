# Standalone file for a published image; needs no source checkout. Same
# service as compose.yaml without the build. Pin BURZBLOG_IMAGE to a digest.
services:
  burzblog:
    image: "${BURZBLOG_IMAGE:?Set an explicitly published image digest or version}"
    user: "${BURZBLOG_UID:?Set BURZBLOG_UID to the numeric owner of the data directory}:${BURZBLOG_GID:?Set BURZBLOG_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 25s
    # Published on host loopback only; put your HTTPS reverse proxy in front.
    ports:
      - "127.0.0.1:${BURZBLOG_PORT:-8080}:8080"
    environment:
      BURZBLOG_ORIGIN: "${BURZBLOG_ORIGIN:?Set BURZBLOG_ORIGIN to the exact public URL}"
      # Optional: a deploy hook URL to rebuild your site after publishing.
      BURZBLOG_DEPLOY_HOOK: ${BURZBLOG_DEPLOY_HOOK:-}
    volumes:
      # The SQLite database (posts, accounts, tokens). Back it up.
      - type: bind
        source: ${BURZBLOG_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
