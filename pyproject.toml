[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "burzblog"
version = "1.0.0"
description = "File-first Markdown content foundation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "markdown-it-py==4.0.0",
    "nh3==0.3.6",
    "ruamel.yaml==0.18.16",
    "uvicorn==0.52.1",
]

[project.scripts]
burzblog = "burzblog.cli:main"
burzblog-server = "burzblog.server:main"

[project.urls]
Repository = "https://github.com/weburz/burzblog"
Issues = "https://github.com/weburz/burzblog/issues"

[dependency-groups]
dev = [{include-group = "linters"}, {include-group = "tests"}, {include-group = "build"}]
linters = ["mypy==2.3.0", "pyright==1.1.411", "ruff==0.16.3", "pre-commit==4.6.2", "pre-commit-hooks==6.0.0"]
tests = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-cov==6.3.0",
]
build = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/burzblog"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "D", "UP", "B", "S", "N"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=burzblog --cov-report=term-missing --cov-fail-under=80"
