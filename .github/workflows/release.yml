name: Release
# Pushing a vX.Y.Z tag releases BurzBlog: after the full gates pass, it builds
# the binaries, tests and publishes the multi-arch image to GHCR, then creates
# the GitHub release with the binaries, SHA256SUMS and the CHANGELOG section.
# Only org admins can create v* tags and they cannot be moved (tag rulesets).
# Run it by hand on main to test everything without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "$tag is not a vX.Y.Z tag; nothing is released" >&2
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The browser gates, the same as check.yml: Chromium and its libraries come
  # preinstalled in the Playwright container. Keep the tag in step with
  # @playwright/test in web/package.json.
  web:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.15.1'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web

  # Go vet and race tests, then the six binaries and their checksums.
  binaries:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs the tag to stamp the version into the binaries.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.15.1'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Builds the panel, runs go vet and the race tests, then cross-compiles.
      - run: task release
      - name: Check the version stamp
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out=$(dist/burzblog-*-linux-amd64 --version)
          echo "$out"
          if [[ "$RELEASE" == "true" && "$out" != "burzblog version v$VERSION" ]]; then
            echo "the binary reports '$out', expected v$VERSION" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [version, web, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Lint Dockerfile
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          tags: burzblog:local
      - run: task docker:smoke
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        if: env.RELEASE == 'true'
        id: tags
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          repo="${IMAGE_REPOSITORY,,}"
          if docker manifest inspect "${repo}:${VERSION}" > /dev/null 2>&1; then
            echo "${repo}:${VERSION} already exists; published tags are never overwritten" >&2
            exit 1
          fi
          major="${VERSION%%.*}"
          minor="${VERSION#*.}"
          minor="${minor%%.*}"
          {
            echo "list<<EOF"
            echo "${repo}:${VERSION}"
            echo "${repo}:${major}.${minor}"
            echo "${repo}:${major}"
            echo "${repo}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the multi-arch image
        if: env.RELEASE == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
      - name: Record the digest
        if: env.RELEASE == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: printf 'Published digest %s as:\n%s\n' "$DIGEST" "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  # Last, so a release only appears once the image is out.
  release:
    needs: [version, binaries, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Write the release notes
        run: scripts/release-notes.sh "$VERSION" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "BurzBlog $VERSION" \
            --notes-file notes.md dist/burzblog-v"$VERSION"-* dist/SHA256SUMS-v"$VERSION"
