name: Container image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact tested image to GHCR. Only honoured on a v* tag whose version matches pyproject.toml, after the full local gates and the container smoke test pass in this run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release version
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(python3 -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v${version}" ]]; then
              echo "Tag $GITHUB_REF does not match pyproject.toml version ${version}; expected refs/tags/v${version}" >&2
              exit 1
            fi
            release=true
          elif [[ "$PUBLISH" == "true" ]]; then
            echo "Publishing requires a v${version} tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          python-version: '3.14'
          enable-cache: false
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.54.0'
      - run: task setup && task check
      - name: Lint Dockerfile
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: burzblog:local
      - run: task docker:smoke
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish && steps.release.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: inputs.publish && steps.release.outputs.release == 'true'
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sha_ref="${IMAGE_REPOSITORY,,}:sha-${GITHUB_SHA}"
          version_ref="${IMAGE_REPOSITORY,,}:v${VERSION}"
          if docker manifest inspect "$version_ref" > /dev/null 2>&1; then
            echo "$version_ref already exists; published tags are never overwritten" >&2
            exit 1
          fi
          for image_ref in "$sha_ref" "$version_ref"; do
            docker tag burzblog:local "$image_ref"
            docker push "$image_ref"
          done
          for image_ref in "$sha_ref" "$version_ref"; do
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image_ref")"
            echo "Published ${image_ref} digest ${digest}" >> "$GITHUB_STEP_SUMMARY"
          done
