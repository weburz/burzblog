name: Container image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact tested image to GHCR. Only honoured on a v* tag, after the full gates and the container smoke test pass in this run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release version
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          release=false
          version="${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          elif [[ "$PUBLISH" == "true" ]]; then
            echo "Publishing requires a v* tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.15.1'
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.54.0'
      - run: task setup && task go:check && task web:check
      - name: Lint Dockerfile
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64
          tags: burzblog:local
      - run: task docker:smoke
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish && steps.release.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        if: inputs.publish && steps.release.outputs.release == 'true'
        id: tags
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          repo="${IMAGE_REPOSITORY,,}"
          if docker manifest inspect "${repo}:${VERSION}" > /dev/null 2>&1; then
            echo "${repo}:${VERSION} already exists; published tags are never overwritten" >&2
            exit 1
          fi
          major="${VERSION%%.*}"
          minor="${VERSION#*.}"
          minor="${minor%%.*}"
          {
            echo "list<<EOF"
            echo "${repo}:${VERSION}"
            echo "${repo}:${major}.${minor}"
            echo "${repo}:${major}"
            echo "${repo}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the multi-arch image
        if: inputs.publish && steps.release.outputs.release == 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
      - name: Record the digest
        if: inputs.publish && steps.release.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: printf 'Published digest %s as:\n%s\n' "$DIGEST" "$TAGS" >> "$GITHUB_STEP_SUMMARY"
