name: Container image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact tested image to GHCR. Only honoured on a v* tag, after the full gates and the container smoke test pass in this run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          release=false
          version="${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          elif [[ "$PUBLISH" == "true" ]]; then
            echo "Publishing requires a v* tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.15.1'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task setup && task go:check && task web:check
      - name: Lint Dockerfile
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64
          tags: burzblog:local
      - run: task docker:smoke
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.publish && steps.release.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        if: inputs.publish && steps.release.outputs.release == 'true'
        id: tags
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          repo="${IMAGE_REPOSITORY,,}"
          if docker manifest inspect "${repo}:${VERSION}" > /dev/null 2>&1; then
            echo "${repo}:${VERSION} already exists; published tags are never overwritten" >&2
            exit 1
          fi
          major="${VERSION%%.*}"
          minor="${VERSION#*.}"
          minor="${minor%%.*}"
          {
            echo "list<<EOF"
            echo "${repo}:${VERSION}"
            echo "${repo}:${major}.${minor}"
            echo "${repo}:${major}"
            echo "${repo}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the multi-arch image
        if: inputs.publish && steps.release.outputs.release == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
      - name: Record the digest
        if: inputs.publish && steps.release.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: printf 'Published digest %s as:\n%s\n' "$DIGEST" "$TAGS" >> "$GITHUB_STEP_SUMMARY"
