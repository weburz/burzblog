name: Checks
on:
  pull_request:
  # The merge queue tests each queued PR on top of main before merging it.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs on every pull request and merge-queue entry; `task check` runs the same
# gates locally. `go` and `web` are required checks for main.
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - run: task go:check
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled; installing them with
    # `playwright install --with-deps` took over ten minutes of apt per run.
    # Keep the tag in step with @playwright/test in web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.15.1'
      # The workspace belongs to the runner user, not the container's root;
      # without this, git (and go build's VCS stamp) refuses the repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
