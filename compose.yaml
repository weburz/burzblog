# Local build of BurzBlog. compose.dist.yaml is the same service for a
# published image. Create the data directory first (owned by BURZBLOG_UID):
# Compose refuses to invent a root-owned replacement for a missing path.
services:
  burzblog:
    image: burzblog:local
    build: .
    user: "${BURZBLOG_UID:?Set BURZBLOG_UID to the numeric owner of the data directory}:${BURZBLOG_GID:?Set BURZBLOG_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 25s
    # Published on host loopback only; put your HTTPS reverse proxy in front.
    ports:
      - "127.0.0.1:${BURZBLOG_PORT:-8080}:8080"
    environment:
      BURZBLOG_ORIGIN: "${BURZBLOG_ORIGIN:?Set BURZBLOG_ORIGIN to the exact public URL}"
      # Optional: a deploy hook URL to rebuild your site after publishing.
      BURZBLOG_DEPLOY_HOOK: ${BURZBLOG_DEPLOY_HOOK:-}
      # Optional: automatic encrypted snapshots, e.g. daily to S3-compatible
      # storage. See docs/self-hosting.md#automatic-snapshots.
      BURZBLOG_SNAPSHOT_EVERY: ${BURZBLOG_SNAPSHOT_EVERY:-}
      BURZBLOG_SNAPSHOT_TO: ${BURZBLOG_SNAPSHOT_TO:-}
      BURZBLOG_SNAPSHOT_KEEP: ${BURZBLOG_SNAPSHOT_KEEP:-}
      BURZBLOG_SNAPSHOT_PASSPHRASE: ${BURZBLOG_SNAPSHOT_PASSPHRASE:-}
      BURZBLOG_SNAPSHOT_HEARTBEAT: ${BURZBLOG_SNAPSHOT_HEARTBEAT:-}
      BURZBLOG_S3_ENDPOINT: ${BURZBLOG_S3_ENDPOINT:-}
      BURZBLOG_S3_REGION: ${BURZBLOG_S3_REGION:-}
      BURZBLOG_S3_ACCESS_KEY_ID: ${BURZBLOG_S3_ACCESS_KEY_ID:-}
      BURZBLOG_S3_SECRET_ACCESS_KEY: ${BURZBLOG_S3_SECRET_ACCESS_KEY:-}
    volumes:
      # The SQLite database (posts, accounts, tokens) and uploads. Back it up.
      - type: bind
        source: ${BURZBLOG_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
