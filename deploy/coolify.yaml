# documentation: https://github.com/weburz/burzblog/blob/main/docs/containers.md#coolify
# slogan: BurzBlog is a small self-hosted blog server: write Markdown posts in the browser or the terminal, feed your website.
# category: cms
# tags: blog, markdown, cms, sqlite, publishing, headless
# logo: https://raw.githubusercontent.com/weburz/burzblog/main/site/assets/favicon.svg
# port: 8080

services:
  burzblog:
    # Pinned. Bump BURZBLOG_VERSION to update; "2" follows the latest 2.x.y.
    image: "ghcr.io/weburz/burzblog:${BURZBLOG_VERSION:-2.3.1}"
    environment:
      # Coolify generates the public URL, routes the domain to port 8080 and
      # fills $SERVICE_URL_BURZBLOG, which BurzBlog needs as its exact origin.
      - SERVICE_URL_BURZBLOG_8080
      - BURZBLOG_ORIGIN=$SERVICE_URL_BURZBLOG
      # Optional resource settings. Mark credentials, passphrases and hooks as secrets.
      - BURZBLOG_SITE_URL=${BURZBLOG_SITE_URL:-}
      - BURZBLOG_SITE_TITLE=${BURZBLOG_SITE_TITLE:-}
      - BURZBLOG_SITE_DESCRIPTION=${BURZBLOG_SITE_DESCRIPTION:-}
      - BURZBLOG_SITE_LANGUAGE=${BURZBLOG_SITE_LANGUAGE:-}
      - BURZBLOG_POST_PATH=${BURZBLOG_POST_PATH:-}
      - BURZBLOG_TAG_PATH=${BURZBLOG_TAG_PATH:-}
      - BURZBLOG_MAX_UPLOAD_MB=${BURZBLOG_MAX_UPLOAD_MB:-}
      - BURZBLOG_CHECK_UPDATES=${BURZBLOG_CHECK_UPDATES:-}
      - BURZBLOG_DEPLOY_HOOK=${BURZBLOG_DEPLOY_HOOK:-}
      - BURZBLOG_SNAPSHOT_EVERY=${BURZBLOG_SNAPSHOT_EVERY:-}
      - BURZBLOG_SNAPSHOT_TO=${BURZBLOG_SNAPSHOT_TO:-}
      - BURZBLOG_SNAPSHOT_KEEP=${BURZBLOG_SNAPSHOT_KEEP:-}
      - BURZBLOG_SNAPSHOT_PASSPHRASE=${BURZBLOG_SNAPSHOT_PASSPHRASE:-}
      - BURZBLOG_SNAPSHOT_HEARTBEAT=${BURZBLOG_SNAPSHOT_HEARTBEAT:-}
      - BURZBLOG_S3_ENDPOINT=${BURZBLOG_S3_ENDPOINT:-}
      - BURZBLOG_S3_REGION=${BURZBLOG_S3_REGION:-}
      - BURZBLOG_S3_ACCESS_KEY_ID=${BURZBLOG_S3_ACCESS_KEY_ID:-}
      - BURZBLOG_S3_SECRET_ACCESS_KEY=${BURZBLOG_S3_SECRET_ACCESS_KEY:-}
      - BURZBLOG_SNAPSHOT_PASSPHRASE_FILE=${BURZBLOG_SNAPSHOT_PASSPHRASE_FILE:-}
      - BURZBLOG_S3_SECRET_ACCESS_KEY_FILE=${BURZBLOG_S3_SECRET_ACCESS_KEY_FILE:-}
      - BURZBLOG_S3_VIRTUAL_HOSTED=${BURZBLOG_S3_VIRTUAL_HOSTED:-}
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev
    volumes:
      # The SQLite database (posts, accounts, tokens) and uploads. Back it up:
      # Coolify's backups do not cover it; see BURZBLOG_SNAPSHOT_* above.
      - burzblog-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/burzblog", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  burzblog-data:
