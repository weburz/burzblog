# BurzBlog behind nginx on the same host. Place in /etc/nginx/conf.d/ (http
# context), replace blog.example.org and the certificate paths, then run
# `nginx -t`. BurzBlog requires the original Host header and ignores
# X-Forwarded-* headers.
limit_conn_zone $binary_remote_addr zone=burzblog_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.org;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.org;

    ssl_certificate /etc/letsencrypt/live/blog.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    limit_conn burzblog_per_ip 20;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
