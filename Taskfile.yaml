version: '3'

tasks:
  default:
    desc: List available development commands
    cmd: task --list
  setup:
    desc: Install locked uv/pnpm dependencies and the test browser
    cmds:
      - uv sync --frozen
      - task: web:setup
  dev:
    desc: Run the configured API and browser development servers
    cmd: task --parallel api:dev web:dev
  lint:
    desc: Check Python formatting and lint rules
    cmds:
      - uv run --frozen ruff format --check .
      - uv run --frozen ruff check .
  typecheck:
    desc: Run strict mypy and Pyright
    cmds:
      - uv run --frozen mypy
      - uv run --frozen pyright
  test:
    desc: Run unit and filesystem/CLI integration tests with coverage
    cmd: uv run --frozen pytest
  build:
    desc: Build the wheel and source distribution using the locked backend
    cmd: uv build --no-sources --no-build-isolation
  check:
    desc: Run all local merge gates (Actions is intentionally disabled)
    cmds:
      - task: backend:check
      - task: web:check
  backend:check:
    desc: Check the independently usable Python backend
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: build
      - task: hooks:check
  web:setup:
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec playwright install chromium
  web:dev:
    dir: web
    cmd: pnpm dev
  api:dev:
    cmd: uv run --frozen burzblog-server serve
  web:check:
    dir: web
    cmd: pnpm check
  measure:
    desc: Measure disposable local production fixtures (requires built web output)
    cmd: uv run --frozen python scripts/measure.py
  format:
    desc: Format Python source
    cmd: uv run --frozen ruff format .
  hooks:install:
    desc: Install optional local pre-commit and Crisp commit-message hooks
    cmd: uv run --frozen pre-commit install
  hooks:check:
    desc: Run repository hygiene hooks and static checks on tracked files
    cmd: uv run --frozen pre-commit run --all-files
  docker:lint:
    desc: Lint the Dockerfile with Hadolint 2.15.1 (standalone, else its pinned image)
    cmd: >-
      if command -v hadolint >/dev/null; then hadolint Dockerfile;
      else docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile;
      fi
  docker:build:
    desc: Build the browser application image locally (requires Docker)
    cmd: docker build --tag burzblog:local .
  docker:smoke:
    desc: Container acceptance test against disposable fixtures (requires Docker)
    cmd: uv run --frozen python scripts/docker-smoke.py
  proxy:lint:
    desc: Validate deploy/Caddyfile and deploy/nginx.conf in pinned images (requires Docker)
    cmd: bash scripts/proxy-config-check.sh
  docker:check:
    desc: Lint, build and acceptance-test the image and proxy examples (requires Docker)
    cmds:
      - task: docker:lint
      - task: proxy:lint
      - task: docker:build
      - task: docker:smoke
