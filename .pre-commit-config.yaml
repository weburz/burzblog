default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l "$@"); test -z "$out" || { echo "$out"; echo "Run task format to fix these."; exit 1; }' --
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: crisp
        name: Conventional commit message
        entry: bash -c 'crisp message --stdin < "$1"' --
        language: system
        stages: [commit-msg]
